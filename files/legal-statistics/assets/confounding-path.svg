<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 170" role="img" aria-labelledby="title">
  <title id="title">混淆变量路径图：Z 指向 X 和 Y，X 指向 Y</title>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 Z" fill="#222"/>
    </marker>
  </defs>
  <g stroke="#222" stroke-width="2" fill="none" marker-end="url(#arrow)">
    <path d="M 142 56 L 79 112"/>
    <path d="M 178 56 L 241 112"/>
    <path d="M 84 130 H 236"/>
  </g>
  <g fill="#fff" stroke="#222" stroke-width="2">
    <circle cx="160" cy="40" r="24"/>
    <circle cx="60" cy="130" r="24"/>
    <circle cx="260" cy="130" r="24"/>
  </g>
  <g fill="#222" text-anchor="middle" font-family="serif" font-style="italic" font-size="20">
    <text x="160" y="47">Z</text>
    <text x="60" y="137">X</text>
    <text x="260" y="137">Y</text>
  </g>
</svg>
